<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Editor do site — ficha do cliente</title>
<link rel="icon" href="site/assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Instrument+Serif&display=swap">
<link rel="stylesheet" href="editor/editor.css">
<!-- carrega a configuração atual do site como ponto de partida -->
<script src="site/config.js"></script>
<script src="editor/editor.js" defer></script>
</head>
<body>
<div class="app">

  <aside class="painel" aria-label="Ficha do cliente">
    <header class="painel__cab">
      <div class="painel__titulo">
        <h1>Ficha do cliente</h1>
        <p data-nome-cliente>—</p>
      </div>
      <div class="ficha-progresso" title="Campos essenciais preenchidos">
        <span data-progresso-txt>0 de 0</span>
        <div class="ficha-progresso__barra"><span data-progresso-barra></span></div>
      </div>
    </header>
    <div class="painel__procura">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input type="search" placeholder="Procurar um campo (ex.: telefone, NIF)" aria-label="Procurar um campo" data-procura-campos>
    </div>
    <div class="painel__pendentes" data-pendentes hidden></div>
    <form class="painel__form" data-form autocomplete="off" novalidate></form>
  </aside>

  <section class="palco" aria-label="Pré-visualização">
    <div class="palco__barra">
      <div class="seg" role="group" aria-label="Página a pré-visualizar" data-paginas>
        <button type="button" data-pagina="index" aria-pressed="true">Início</button>
        <button type="button" data-pagina="privacidade" aria-pressed="false">Privacidade</button>
        <button type="button" data-pagina="termos" aria-pressed="false">Termos</button>
        <button type="button" data-pagina="cookies" aria-pressed="false">Cookies</button>
      </div>
      <div class="seg" role="group" aria-label="Tamanho do ecrã" data-tamanhos>
        <button type="button" data-tamanho="100%" aria-pressed="true" title="Computador"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg><span class="sr">Computador</span></button>
        <button type="button" data-tamanho="820px" aria-pressed="false" title="Tablet"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M11 18h2"/></svg><span class="sr">Tablet</span></button>
        <button type="button" data-tamanho="390px" aria-pressed="false" title="Telemóvel"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="3" width="10" height="18" rx="2"/><path d="M11 18h2"/></svg><span class="sr">Telemóvel</span></button>
      </div>
      <div class="palco__acoes">
        <button type="button" class="botao" data-acao="importar">Importar ficha</button>
        <button type="button" class="botao" data-acao="descarregar">Descarregar config.js</button>
        <button type="button" class="botao botao--principal" data-acao="guardar">Guardar no site</button>
        <details class="mais">
          <summary class="botao" aria-label="Mais opções">···</summary>
          <div class="mais__menu">
            <button type="button" data-acao="pasta">Escolher outra pasta do site</button>
            <button type="button" data-acao="seo">Descarregar sitemap.xml e robots.txt</button>
            <button type="button" data-acao="copiar">Copiar config.js</button>
            <button type="button" data-acao="descartar">Descartar alterações por guardar</button>
          </div>
        </details>
      </div>
    </div>
    <div class="palco__moldura" data-moldura>
      <iframe title="Pré-visualização do site" data-iframe src="site/index.html?editor=1"></iframe>
    </div>
    <p class="palco__rodape" data-estado-guardar>As alterações aparecem logo no site ao lado. Ficam guardadas neste browser até carregar em “Guardar no site”.</p>
  </section>

</div>
<input type="file" accept=".js,.json,application/json,text/javascript" hidden data-ficheiro-importar>
<div class="aviso" role="status" aria-live="polite" data-aviso></div>
</body>
</html>
